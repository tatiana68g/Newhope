<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	
	<link href="https://fonts.googleapis.com/css?family=Montserrat:200,300,400,500,600,700,800&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
	
	<link rel="stylesheet" href="css/animate.css">
	
	<link rel="stylesheet" href="css/owl.carousel.min.css">
	<link rel="stylesheet" href="css/owl.theme.default.min.css">
	<link rel="stylesheet" href="css/magnific-popup.css">


	<link rel="stylesheet" href="css/bootstrap-datepicker.css">
	<link rel="stylesheet" href="css/jquery.timepicker.css">

	<link rel="stylesheet" href="css/flaticon.css">
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
	<title>Donate</title>
</head>
<style>
	.container{
		margin-top: 200px;
		margin-left: 650px;
	}
</style>
<body>
	
 <section class="ftco-appointment ftco-section ftco-no-pt ftco-no-pb img">
	 <div class="container">
		<div class="row">
			<div class="col-md-5 order-md-last d-flex align-items-stretch">
				<div class="donation-wrap">
					<div class="total-donate d-flex align-items-center">
						<span class="fa flaticon-cleaning"></span>
						<h4>Devenez acteur du changement<br>Faites un don</h4>
						<p class="d-flex align-items-center">
							<span>$</span>
							<span class="number" data-number="24781">0</span>
						</p>
						</div>
						<form action="#" class="appointment">
							<div class="row">
								<div class="col-md-12">
									<div class="form-group">
										<label for="name">Nom complet</label>
										<div class="input-wrap">
											<div class="icon"><span class="fa fa-user"></span></div>
											<input type="text" class="form-control" placeholder="">
										</div>
									</div>
								</div>
								<div class="col-md-12">
									<div class="form-group">
										<label for="email">Adresse e-mail</label>
										<div class="input-wrap">
											<div class="icon"><span class="fa fa-paper-plane"></span></div>
											<input type="email" class="form-control" placeholder="">
										</div>
									</div>
								</div>
								<div class="col-md-12">
									<div class="form-group">
										<label for="cause">Sélectionner une cause</label>
										<div class="form-field">
											<div class="select-wrap">
												<div class="icon"><span class="fa fa-chevron-down"></span></div>
												<select name="cause" id="cause" class="form-control">
													<option value=""></option>
													<option value="">Nettoyage de maison</option>
													<option value="">Nettoyage de toiture</option>
													<option value="">Nettoyage d'allée</option>
													<option value="">Nettoyage de gouttière</option>
													<option value="">Nettoyage de patio</option>
													<option value="">Nettoyage de bâtiment</option>
													<option value="">Nettoyage de béton</option>
													<option value="">Nettoyage de trottoir</option>
												</select>
											</div>
										</div>
									</div>
								</div>
								<div class="col-md-12">
									<div class="form-group">
										<label for="amount">Montant</label>
										<div class="input-wrap">
											<div class="icon"><span class="fa fa-money"></span></div>
											<input type="text" class="form-control" placeholder="$5">
										</div>
									</div>
								</div>
								<div class="col-md-12">
									<div class="form-group">
										<label for="payment">Mode de paiement</label>
										<div class="d-lg-flex">
											<div class="form-radio mr-3">
												<div class="radio">
													<label>
														<input type="radio" name="radio-input" checked>
														<span class="checkmark"></span>
														<span class="fill-control-description">Carte de crédit</span>
													</label>
												</div>
											</div>
											<div class="form-radio mr-3">
												<div class="radio">
													<label>
														<input type="radio" name="radio-input">
														<span class="checkmark"></span>
														<span class="fill-control-description">PayPal</span>
													</label>
												</div>
											</div>
											<div class="form-radio">
												<div class="radio">
													<label>
														<input type="radio" name="radio-input">
														<span class="checkmark"></span>
														<span class="fill-control-description">Payoneer</span>
													</label>
												</div>
											</div>
										</div>
									</div>
								</div> 
								<div class="col-md-12">
									<div class="form-group">
										<input type="submit" value="Faire un don" class="btn btn-secondary py-3 px-4">
									</div>
								</div>
							</div>
						</form> 
						</div>
						</div>
						</section>
						
	
</body>
</html>
